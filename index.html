<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Page</title>
<style>
  :root {
    --bg: #12141a;
    --card: #1b1e26;
    --ink: #e8eaf0;
    --muted: #9aa0ae;
    --accent: #7bdcb5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 30% 20%, #232838, var(--bg));
    color: var(--ink);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    max-width: 34rem;
    padding: 2.5rem;
    border: 1px solid #2c3140;
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
  }
  h1 { margin: 0 0 .25rem; font-size: 1.9rem; letter-spacing: -.02em; }
  .tag {
    display: inline-block;
    margin-bottom: 1.25rem;
    padding: .15rem .6rem;
    border-radius: 999px;
    background: rgba(123, 220, 181, .12);
    color: var(--accent);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  code { color: var(--accent); font-size: .9em; }
  a.btn {
    display: inline-block;
    padding: .6rem 1.2rem;
    border-radius: 8px;
    background: var(--accent);
    color: #10221b;
    font-weight: 600;
    text-decoration: none;
    transition: transform .15s ease, opacity .15s ease;
  }
  a.btn:hover { transform: translateY(-2px); opacity: .9; }
</style>
</head>
<body>
  <main class="card">
    <span class="tag">Test</span>
    <h1>Hello from index.html</h1>
    <p>Static test page served from <code>/private/tmp/dotfiles</code>. Edit the styles above to try things out.</p>
    <a class="btn" href="#">Nothing happens</a>
  </main>
</body>
</html>
