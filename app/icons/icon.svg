<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D9531E"/>
    </linearGradient>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D9531E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring (Folk Art Geometry) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#D9531E" stroke-width="6" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.4"/>

  <!-- Sun Disc -->
  <circle cx="256" cy="256" r="150" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Math Symbols in Harmonious Folk Pattern -->
  <!-- Plus + -->
  <g transform="translate(190, 160)" fill="#FFFFFF">
    <rect x="-8" y="-28" width="16" height="56" rx="8"/>
    <rect x="-28" y="-8" width="56" height="16" rx="8"/>
  </g>

  <!-- Multiply × -->
  <g transform="translate(322, 160) rotate(45)" fill="#FFFFFF">
    <rect x="-8" y="-28" width="16" height="56" rx="8"/>
    <rect x="-28" y="-8" width="56" height="16" rx="8"/>
  </g>

  <!-- Divide ÷ -->
  <g transform="translate(190, 340)" fill="#FFFFFF">
    <rect x="-28" y="-7" width="56" height="14" rx="7"/>
    <circle cx="0" cy="-22" r="8"/>
    <circle cx="0" cy="22" r="8"/>
  </g>

  <!-- Minus − / Equal = -->
  <g transform="translate(322, 340)" fill="#FFFFFF">
    <rect x="-28" y="-18" width="56" height="14" rx="7"/>
    <rect x="-28" y="6" width="56" height="14" rx="7"/>
  </g>

  <!-- Center Hummingbird Mascot (Colibrí) Silhouette -->
  <g transform="translate(256, 252) scale(0.95)" fill="#FFFFFF">
    <!-- Beak -->
    <path d="M-8,-12 L-65,-22 L-8,-4 Z" fill="#FEF3C7"/>
    <!-- Head & Eye -->
    <circle cx="0" cy="-10" r="18" fill="#FFFFFF"/>
    <circle cx="-5" cy="-12" r="4" fill="#0F172A"/>
    <!-- Wing Spread Up -->
    <path d="M6,-14 C20,-50 60,-65 80,-55 C82,-35 45,-8 18,2 Z" fill="#FEF3C7" opacity="0.95"/>
    <!-- Body -->
    <path d="M0,-5 C-6,15 5,45 28,62 C34,66 38,58 32,50 C24,35 22,15 15,-2 Z" fill="#FFFFFF"/>
    <!-- Tail Feathers -->
    <path d="M26,58 L48,96 L36,98 L20,64 Z" fill="#34D399"/>
    <path d="M30,55 L60,90 L52,94 L24,62 Z" fill="#F59E0B"/>
  </g>

  <!-- Star Embellishments -->
  <polygon points="256,65 262,80 278,80 265,90 270,105 256,95 242,105 247,90 234,80 250,80" fill="#FEF3C7"/>
  <polygon points="256,415 262,430 278,430 265,440 270,455 256,445 242,455 247,440 234,430 250,430" fill="#FEF3C7"/>
</svg>
